name: Validate What's On

on:
  push:
    branches:
      - 'chatgpt/**'
      - 'devin/**'
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test event parsing and presentation
        run: npm test
      - name: Check static site build (without live calendar credentials)
        run: npm run build
      - name: Check generated preview pages
        run: |
          test -s _site/index.html
          test -s _site/timetable.html
          test -s _site/banner.html
          test -s _site/whats-on.html
          test -s _site/calendar.html
          test -s _site/events.json
