name: Validate What's On

on:
  push:
    branches:
      - 'chatgpt/**'
      - 'devin/**'
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Inspect first campaign images in the public RSS feed
        if: github.event_name == 'push'
        env:
          MAILCHIMP_RSS_URL: ${{ vars.MAILCHIMP_RSS_URL }}
        run: |
          node --input-type=module <<'JS'
          const url = process.env.MAILCHIMP_RSS_URL;
          if (!url) { console.log('RSS variable unavailable in branch validation'); process.exit(0); }
          try {
            const res = await fetch(url, { signal: AbortSignal.timeout(15000) });
            if (!res.ok) throw Error('Feed HTTP '+res.status);
            const xml = await res.text();
            const item = xml.match(/<item\b[^>]*>([\s\S]*?)<\/item>/i)?.[1] || '';
            const encoded = item.match(/<content:encoded(?:\s[^>]*)?>([\s\S]*?)<\/content:encoded>/i)?.[1] || item.match(/<description(?:\s[^>]*)?>([\s\S]*?)<\/description>/i)?.[1] || '';
            const html = encoded.replace(/^<!\[CDATA\[([\s\S]*?)\]\]>$/, '$1').replace(/&lt;/g,'<').replace(/&gt;/g,'>');
            console.log('Latest RSS item img tags:', [...html.matchAll(/<img\b[^>]*>/gi)].slice(0,8).map((m,i)=>[i,m[0].slice(0,450)]));
          } catch(e) { console.log('Could not inspect RSS:',e.message); }
          JS
      - name: Test event parsing and presentation
        run: npm test
      - name: Install headless Chromium for editor interaction smoke test
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: 'Browser test: calendar clicks open editor'
        run: node scripts/test-admin-browser.mjs
      - name: Create realistic API-free preview data
        run: node scripts/preview-data.mjs
      - name: Create sample weekly mailing for standalone preview
        run: node scripts/sync-mailings.mjs
      - name: Check static site build (without live calendar credentials)
        run: npm run build
      - name: Attach standalone editor UI for review before merge
        uses: actions/upload-artifact@v4
        with:
          name: whats-on-editor-ui-demo
          path: site/admin-demo.html
          if-no-files-found: error
          retention-days: 30

      - name: Check generated preview pages
        run: |
          test -s _site/index.html
          test -s _site/admin-demo.html
          test -s _site/timetable.html
          test -s _site/mailing-hero.html
          test -s _site/assets/mailing-hero.js
          test -s _site/banner.html
          test -s _site/whats-on.html
          test -s _site/calendar.html
          test -s _site/mailings.html
          test -s _site/mailings.json
          test -s _site/events.json
          test -s _site/assets/sample-community.svg
          test -s _site/assets/sample-fair.svg
          node -e "const d=require('./_site/events.json');if(!d.preview||d.events.length<25)process.exit(1);"
          node -e "const d=require('./_site/mailings.json');if(!d.preview||!d.mailings.some(m=>m.title.includes('sample')))process.exit(1);"
