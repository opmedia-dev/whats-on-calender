name: Build and deploy What's On

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even if the calendar is unchanged
        type: boolean
        default: false

permissions:
  actions: write
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.decide.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install poppler (PDF posters)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      # Downloaded attachments are cached between runs so Google Drive isn't
      # asked for the same posters every 15 minutes.
      - uses: actions/cache@v4
        with:
          path: .cache
          key: attachments-${{ github.run_id }}
          restore-keys: attachments-

      # Without the Google API secret we publish explicitly labelled sample
      # events for pre-rollout review. Never claim to show real calendar data.
      - name: Detect preview or live data source
        id: source
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          if [ -n "$GOOGLE_API_KEY" ]; then
            echo "mode=live" >> "$GITHUB_OUTPUT"
            echo "Google Calendar configured: building live event data."
          else
            echo "mode=preview" >> "$GITHUB_OUTPUT"
            echo "::warning::GOOGLE_API_KEY is not configured. This deployment will show DEMONSTRATION events, never real calendar events."
          fi

      - name: Sync Google Calendar
        id: sync
        if: steps.source.outputs.mode == 'live'
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GCAL_ID: ${{ vars.GCAL_ID }}
          SITE_URL: ${{ github.event_name == 'schedule' && format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) || '' }}
          FORCE: ${{ inputs.force || 'false' }}
        run: node scripts/sync-calendar.mjs

      - name: Generate demonstration calendar
        if: steps.source.outputs.mode == 'preview' && github.event_name != 'schedule'
        run: node scripts/preview-data.mjs

      - name: Decide whether to publish
        id: decide
        env:
          MODE: ${{ steps.source.outputs.mode }}
          EVENT: ${{ github.event_name }}
          SYNC_CHANGED: ${{ steps.sync.outputs.changed }}
        run: |
          if [ "$MODE" = 'preview' ]; then
            # Avoid redeploying unchanged sample content every 15 minutes.
            if [ "$EVENT" = 'schedule' ]; then
              echo "changed=false" >> "$GITHUB_OUTPUT"
            else
              echo "changed=true" >> "$GITHUB_OUTPUT"
            fi
          elif [ "$SYNC_CHANGED" = 'false' ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build site
        if: steps.decide.outputs.changed == 'true'
        run: node scripts/build.mjs

      - uses: actions/upload-pages-artifact@v3
        if: steps.decide.outputs.changed == 'true'
        with:
          path: _site

      # GitHub pauses scheduled workflows in public repos after 60 days without
      # commits; re-enabling via the API keeps the calendar sync running.
      - name: Keep schedule alive
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/deploy.yml/enable" || true

  deploy:
    needs: build
    if: needs.build.outputs.changed != 'false'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
