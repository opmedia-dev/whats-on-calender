name: Build and deploy What's On
run-name: "What's On · ${{ github.event_name == 'schedule' && 'GitHub schedule' || inputs.source || github.event_name }}"

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even if the calendar is unchanged
        type: boolean
        default: false
      source:
        description: What started this run? External schedule uses external-cron
        type: choice
        options: [manual, external-cron]
        default: manual

permissions:
  actions: write
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.decide.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # PDF previews use prebuilt PDFium wheels, cached across scheduled runs.
      # Avoid apt-get: a temporary Ubuntu mirror DNS outage previously broke
      # every calendar publication and then triggered repeated health alerts.
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Restore PDF renderer wheels
        id: pdf-wheels
        uses: actions/cache@v4
        with:
          path: .pdf-wheels
          key: pdfium-wheels-${{ runner.os }}-py312-${{ hashFiles('requirements-pdf.txt') }}

      - name: Download pinned PDF renderer wheels on cache miss
        if: steps.pdf-wheels.outputs.cache-hit != 'true'
        run: |
          python -m pip download --only-binary=:all: --dest .pdf-wheels --retries 3 --timeout 20 -r requirements-pdf.txt

      - name: Install PDF renderer offline from cached wheels
        run: |
          python -m pip install --no-index --find-links=.pdf-wheels --target=.pdf-deps -r requirements-pdf.txt
          echo "PYTHONPATH=$GITHUB_WORKSPACE/.pdf-deps" >> "$GITHUB_ENV"
          echo "PDF_RENDER_PYTHON=$(command -v python)" >> "$GITHUB_ENV"

      - name: Verify PDF poster preview rendering
        env:
          PDF_RENDER_REQUIRED: '1'
        run: node --test test/pdf-renderer.test.mjs

      # Downloaded attachments are cached between runs so Google Drive isn't
      # asked for the same posters every 15 minutes.
      - uses: actions/cache@v4
        with:
          path: .cache
          key: attachments-${{ github.run_id }}
          restore-keys: attachments-

      # Without the Google API secret we publish explicitly labelled sample
      # events for pre-rollout review. Never claim to show real calendar data.
      - name: Detect preview or live data source
        id: source
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          if [ -n "$GOOGLE_API_KEY" ]; then
            echo "mode=live" >> "$GITHUB_OUTPUT"
            echo "Google Calendar configured: building live event data."
          else
            echo "mode=preview" >> "$GITHUB_OUTPUT"
            echo "::warning::GOOGLE_API_KEY is not configured. This deployment will show DEMONSTRATION events, never real calendar events."
          fi

      - name: Sync Mailchimp sent-campaign RSS
        id: mailings
        env:
          MAILCHIMP_RSS_URL: ${{ vars.MAILCHIMP_RSS_URL }}
          SITE_URL: ${{ (github.event_name == 'schedule' || inputs.source == 'external-cron') && format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) || '' }}
          FORCE: ${{ inputs.force || 'false' }}
        run: node scripts/sync-mailings.mjs

      - name: Sync Google Calendar
        id: sync
        if: steps.source.outputs.mode == 'live'
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GCAL_ID: ${{ vars.GCAL_ID }}
          SITE_URL: ${{ (github.event_name == 'schedule' || inputs.source == 'external-cron') && format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) || '' }}
          # A mailing-only change still needs a complete events.json and
          # associated media copied into this combined Pages deployment.
          FORCE: ${{ steps.mailings.outputs.changed == 'true' || inputs.force || 'false' }}
        run: node scripts/sync-calendar.mjs

      - name: Generate demonstration calendar
        if: steps.source.outputs.mode == 'preview'
        run: node scripts/preview-data.mjs

      - name: Decide whether to publish
        id: decide
        env:
          MODE: ${{ steps.source.outputs.mode }}
          EVENT: ${{ github.event_name }}
          SOURCE: ${{ inputs.source || '' }}
          SYNC_CHANGED: ${{ steps.sync.outputs.changed }}
          MAILINGS_CHANGED: ${{ steps.mailings.outputs.changed }}
        run: |
          # External scheduler calls are ordinary workflow_dispatch events,
          # but must behave like scheduled checks: skip publishing unchanged data.
          # Explicit manual runs and push builds still publish unconditionally.
          if [ "$EVENT" = 'schedule' ] || [ "$SOURCE" = 'external-cron' ]; then
            if [ "$MAILINGS_CHANGED" = 'true' ] || { [ "$MODE" = 'live' ] && [ "$SYNC_CHANGED" != 'false' ]; }; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
            else
              echo "changed=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build site
        if: steps.decide.outputs.changed == 'true'
        env:
          # Fail if a configured live RSS feed was erased before publication.
          MAILCHIMP_RSS_URL: ${{ vars.MAILCHIMP_RSS_URL }}
        run: node scripts/build.mjs

      - uses: actions/upload-pages-artifact@v3
        if: steps.decide.outputs.changed == 'true'
        with:
          path: _site

      # GitHub pauses scheduled workflows in public repos after 60 days without
      # commits; re-enabling via the API keeps the calendar sync running.
      - name: Keep schedule alive
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/deploy.yml/enable" || true

  deploy:
    needs: build
    if: needs.build.outputs.changed != 'false'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
