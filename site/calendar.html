<!doctype html>
<html lang="en" data-detail="inline">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calendar</title>
  <link rel="stylesheet" href="assets/wo.css">
</head>
<body>
  <main class="wo-wrap">
    <div id="main" class="wo-cal is-auto">
      <div class="wo-cal-head">
        <h2 id="month" aria-live="polite"></h2>
        <div class="wo-cal-nav">
          <div class="wo-group"><button type="button" id="today">Today</button></div>
          <div class="wo-group"><button type="button" id="prev" aria-label="Previous month"></button><button type="button" id="next" aria-label="Next month"></button></div>
          <div class="wo-group" id="view-toggle" role="group" aria-label="View"><button type="button" data-view="grid" aria-pressed="true"></button><button type="button" data-view="list" aria-pressed="false"></button></div>
        </div>
      </div>
      <div class="wo-cal-board">
        <div class="wo-cal-weekdays" id="weekdays"></div>
        <div class="wo-cal-grid" id="grid"><p class="wo-loading">Loading…</p></div>
      </div>
      <div class="wo-cal-list" id="list"></div>
    </div>
    <div id="detail" hidden></div>
  </main>
  <script type="module">
    import { init, loadEvents, param, num, flag, h, icon, dayKey, addDays, formatMonth, formatTime, eventHref, renderAgendaDay, routeDetails, showError, emptyState } from './assets/wo.js';

    // Google Calendar's event colours, by colorId.
    const COLORS = { 1: '#7986cb', 2: '#33b679', 3: '#8e24aa', 4: '#e67c73', 5: '#f6bf26', 6: '#f4511e', 7: '#039be5', 8: '#616161', 9: '#3f51b5', 10: '#0b8043', 11: '#d50000' };
    await init();
    const main = document.getElementById('main');
    const grid = document.getElementById('grid');
    const list = document.getElementById('list');
    const view = param('view', 'auto');
    main.classList.toggle('is-auto', view === 'auto');
    main.classList.toggle('is-list', view === 'list');
    if (num('cellHeight', 0) > 0) main.style.setProperty('--wo-cell', `${num('cellHeight', 150)}px`);
    const toggle = document.getElementById('view-toggle');
    toggle.hidden = view !== 'auto';
    toggle.children[0].append(icon('grid'), 'Month');
    toggle.children[1].append(icon('list'), 'List');
    for (const b of toggle.children) b.addEventListener('click', () => {
      const list = b.dataset.view === 'list';
      main.classList.toggle('is-list', list);
      main.classList.toggle('is-auto', !list);
      for (const x of toggle.children) x.setAttribute('aria-pressed', String(x === b));
    });
    document.getElementById('prev').append(icon('left'));
    document.getElementById('next').append(icon('right'));
    const short = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
    document.getElementById('weekdays').replaceChildren(...short.map((d) => h('div', {}, d)));

    try {
      const { events, range } = await loadEvents();
      const byDay = new Map();
      for (const e of events) {
        for (let k = e.startKey, n = 0; k <= e.endKey && n < 60; k = addDays(k, 1), n++) {
          if (!byDay.has(k)) byDay.set(k, []);
          byDay.get(k).push(e);
        }
      }
      const today = dayKey(new Date());
      const thisMonth = today.slice(0, 7);
      const startParam = param('month');
      let month = /^\d{4}-\d{2}$/.test(startParam) ? startParam : thisMonth;
      const minMonth = range?.from ? dayKey(new Date(range.from)).slice(0, 7) : null;
      const maxMonth = range?.to ? dayKey(new Date(range.to)).slice(0, 7) : null;
      const shiftMonth = (m, n) => { const d = new Date(`${m}-15T12:00:00Z`); d.setUTCMonth(d.getUTCMonth() + n); return d.toISOString().slice(0, 7); };
      const maxPerDay = num('maxPerDay', 3);
      const dots = flag('dots', false);
      const expanded = new Set();
      let showEarlier = false;

      const item = (e) => {
        const { href, target } = eventHref(e);
        return h('li', { class: `wo-cal-ev${e.featured ? ' is-featured' : ''}`, style: dots && COLORS[e.colorId] ? `--wo-ev:${COLORS[e.colorId]}` : null },
          h('a', { href, target, title: [e.allDay ? null : formatTime(e.startDate), e.title, e.location].filter(Boolean).join(' · ') },
            e.allDay ? null : h('b', {}, formatTime(e.startDate), ' '), e.title));
      };

      const render = () => {
        document.getElementById('month').textContent = formatMonth(new Date(`${month}-15T12:00:00Z`));
        document.getElementById('prev').disabled = Boolean(minMonth && month <= minMonth);
        document.getElementById('next').disabled = Boolean(maxMonth && month >= maxMonth);
        const first = `${month}-01`;
        const weekday = (new Date(`${first}T12:00:00Z`).getUTCDay() + 6) % 7; // Monday = 0
        let start = addDays(first, -weekday);
        const cells = [];
        const nextMonth = shiftMonth(month, 1);
        while (cells.length < 42) {
          const key = start;
          if (cells.length % 7 === 0 && cells.length >= 28 && key.slice(0, 7) >= nextMonth) break;
          const evs = byDay.get(key) || [];
          const open = expanded.has(key);
          const shown = open || evs.length <= maxPerDay + 1 ? evs : evs.slice(0, maxPerDay);
          cells.push(h('div', { class: `wo-cal-day${key.slice(0, 7) !== month ? ' is-other' : ''}${key === today ? ' is-today' : ''}` },
            h('div', { class: 'wo-cal-num' }, String(Number(key.slice(8)))),
            h('ul', {}, shown.map(item)),
            evs.length > shown.length || open ? h('button', { type: 'button', class: 'wo-cal-more', onclick: () => { open ? expanded.delete(key) : expanded.add(key); render(); } },
              open ? param('lessText', 'Show less') : param('moreText', `+${evs.length - shown.length} more`)) : null));
          start = addDays(start, 1);
        }
        grid.replaceChildren(...cells);

        const days = [...byDay.keys()].filter((k) => k.startsWith(month)).sort();
        // In the current month the list starts at today, with a button for the earlier dates.
        const hideEarlier = month === thisMonth && !showEarlier && days.some((k) => k < today) && days.filter((k) => k >= today).length >= 4;
        const listed = hideEarlier ? days.filter((k) => k >= today) : days;
        const earlier = h('button', { type: 'button', class: 'wo-btn wo-btn-ghost wo-btn-sm wo-cal-earlier', onclick: () => { showEarlier = true; render(); } }, param('earlierText', 'Show earlier dates'));
        list.replaceChildren(...(hideEarlier ? [earlier] : []), ...listed.map((k) => renderAgendaDay(k, byDay.get(k), { today })));
        if (!days.length) list.replaceChildren(emptyState('No events this month.'));
      };
      const go = (m) => { month = m; expanded.clear(); showEarlier = false; render(); };
      document.getElementById('prev').addEventListener('click', () => go(shiftMonth(month, -1)));
      document.getElementById('next').addEventListener('click', () => go(shiftMonth(month, 1)));
      document.getElementById('today').addEventListener('click', () => go(thisMonth));
      render();
      routeDetails({ main, detail: document.getElementById('detail'), events, backLabel: param('backText', 'Back to calendar') });
    } catch (e) {
      console.error(e);
      showError(grid, 'Sorry, the calendar could not be loaded.');
    }
  </script>
</body>
</html>
