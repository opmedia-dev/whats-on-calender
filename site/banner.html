<!doctype html>
<html lang="en" data-detail="inline">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>What's happening</title>
  <link rel="stylesheet" href="assets/wo.css">
</head>
<body>
  <main class="wo-wrap">
    <div id="main">
      <h2 class="wo-heading" id="heading" hidden></h2>
      <div class="wo-banner" id="banner">
        <div class="wo-banner-main"><div id="cards" class="wo-cards is-band"><p class="wo-loading">Loading…</p></div><div class="wo-foot" id="foot"><div id="pager"></div></div></div>
      </div>
    </div>
    <div id="detail" hidden></div>
  </main>
  <script type="module">
    import { init, loadEvents, params, param, num, flag, h, icon, isUpcoming, nextPerSeries, renderCard, renderPager, routeDetails, showError, emptyState } from './assets/wo.js';

    await init();
    const cardsEl = document.getElementById('cards');
    const pagerEl = document.getElementById('pager');
    const banner = document.getElementById('banner');

    const title = param('title', "What's happening");
    if (title !== '0') {
      const head = document.getElementById('heading');
      head.textContent = title;
      head.hidden = false;
    }
    if (param('style') === 'plain') cardsEl.classList.remove('is-band');
    if (params.has('ratio')) cardsEl.style.setProperty('--wo-ratio', param('ratio').replace(':', ' / '));

    // Optional fixed flipbook column (the latest issue of the parish magazine).
    if (flag('flipbook', false)) {
      const defaultPreview = 'https://opmedia-dev.github.io/flipbook/preview.html';
      let src;
      try {
        src = new URL(param('flipbookUrl', defaultPreview));
        if (src.protocol !== 'https:') throw new Error('Only HTTPS flipbook previews are supported');
      } catch {
        src = new URL(defaultPreview);
      }
      // The full flipbook needs at least 260px for a page *inside* its own
      // 32px wrapper and this banner's padding. A 300px sidebar clips pages.
      // Keep the small column as a compact reader and offer a full-size link.
      const fullPreview = new URL(src.href);
      if (param('flipbookLink')) src.searchParams.set('link', param('flipbookLink'));
      if (param('accent') && !src.searchParams.has('accent')) src.searchParams.set('accent', param('accent'));
      if (!src.searchParams.has('title')) src.searchParams.set('title', '0');
      if (!src.searchParams.has('maxHeight')) src.searchParams.set('maxHeight', String(num('flipbookHeight', 300)));
      if (!src.searchParams.has('tools')) src.searchParams.set('tools', 'none');
      const frame = h('iframe', {
        src: src.href, title: 'Latest magazine — compact flipbook',
        allow: 'fullscreen; web-share; clipboard-write', allowfullscreen: true,
        loading: 'lazy',
      });
      banner.classList.add('has-side');
      const width = Math.max(340, Math.min(500, num('flipbookWidth', 350)));
      banner.style.setProperty('--wo-side', `${width}px`);
      const sideTitle = param('flipbookTitle', 'Latest magazine');
      banner.append(h('aside', { class: 'wo-banner-side' },
        sideTitle !== '0' ? h('p', { class: 'wo-side-title' }, sideTitle) : null,
        frame,
        h('a', { class: 'wo-magazine-full', href: fullPreview.href,
          target: '_blank', rel: 'noopener noreferrer' }, 'Open full magazine', icon('arrow'))));
      window.addEventListener('message', (e) => {
        if (e.origin !== src.origin || e.source !== frame.contentWindow || e.data?.source !== 'flipbook' || e.data.type !== 'height') return;
        const height = Number(e.data.height);
        if (Number.isFinite(height) && height >= 200) frame.style.height = `${Math.min(height, 2000)}px`;
      });
    }

    const allLink = param('moreLink', param('link'));
    if (/^https?:\/\//.test(allLink) && param('moreText') !== '0') {
      document.getElementById('foot').append(h('a', { class: 'wo-more-link', href: allLink, target: '_top' }, param('moreText', 'See all events'), icon('arrow')));
    }

    try {
      const { events } = await loadEvents();
      const now = new Date();
      let items = nextPerSeries(events.filter((e) => isUpcoming(e, now) && (param('show', 'featured') === 'all' || e.featured)));
      const days = num('days', 0);
      if (days > 0) items = items.filter((e) => e.startDate - now < days * 86400000);
      items = items.slice(0, num('max', 12));

      let page = 0;
      const perPageMax = num('perPage', 3);
      const perPage = () => Math.max(1, Math.min(perPageMax, Math.floor(cardsEl.clientWidth / num('minCardWidth', 240)) || 1));
      let current = perPage();
      const render = () => {
        current = perPage();
        const pages = Math.ceil(items.length / current);
        page = Math.min(page, Math.max(0, pages - 1));
        cardsEl.style.setProperty('--wo-cols', String(current));
        cardsEl.replaceChildren(...items.slice(page * current, page * current + current)
          .map((e) => renderCard(e, { showRecurrence: e.recurring })));
        pagerEl.replaceChildren(renderPager(page, pages, (p) => { page = p; render(); }));
        if (!items.length) cardsEl.replaceChildren(emptyState(param('emptyText', 'More events coming soon.')));
      };
      render();
      new ResizeObserver(() => { if (perPage() !== current) render(); }).observe(cardsEl);
      const seconds = num('autoplay', 0);
      if (seconds > 0) {
        let paused = false;
        banner.addEventListener('mouseenter', () => { paused = true; });
        banner.addEventListener('mouseleave', () => { paused = false; });
        setInterval(() => {
          const pages = Math.ceil(items.length / current);
          if (!paused && pages > 1 && !document.hidden) { page = (page + 1) % pages; render(); }
        }, seconds * 1000);
      }
      routeDetails({ main: document.getElementById('main'), detail: document.getElementById('detail'), events, backLabel: param('backText', 'Back') });
    } catch (e) {
      console.error(e);
      showError(cardsEl, 'Sorry, events could not be loaded.');
    }
  </script>
</body>
</html>
