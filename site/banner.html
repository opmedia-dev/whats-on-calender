<!doctype html>
<html lang="en" data-detail="inline">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>What's happening</title>
  <link rel="stylesheet" href="assets/wo.css">
</head>
<body>
  <main class="wo-wrap">
    <div id="main">
      <h2 class="wo-heading" id="heading" hidden></h2>
      <div class="wo-banner" id="banner">
        <div class="wo-banner-main"><div id="cards" class="wo-cards is-band"><p class="wo-loading">Loading…</p></div><div class="wo-foot" id="foot"><div id="pager"></div></div></div>
      </div>
    </div>
    <div id="detail" hidden></div>
  </main>
  <script type="module">
    import { init, loadEvents, params, param, num, flag, h, icon, isUpcoming, nextPerSeries, renderCard, renderPager, routeDetails, showError, emptyState } from './assets/wo.js';
    import { loadMagazineIssue } from './assets/magazine.js';
    import { loadMailings, makeMailingCard } from './assets/mailings.js';
    import { horizonDays, autoplaySeconds, mayAutoAdvance } from './assets/banner-config.js';

    await init();
    const cardsEl = document.getElementById('cards');
    const pagerEl = document.getElementById('pager');
    const banner = document.getElementById('banner');

    const title = param('title', "What's happening");
    if (title !== '0') {
      const head = document.getElementById('heading');
      head.textContent = title;
      head.hidden = false;
    }
    if (param('style') === 'plain') cardsEl.classList.remove('is-band');
    if (params.has('ratio')) cardsEl.style.setProperty('--wo-ratio', param('ratio').replace(':', ' / '));

    // Show the latest issue as a fourth card, matched to the event-card
    // proportions. A full page-turning PDF reader cannot fit in a card-size
    // column: its minimum book height plus controls exceeded the event row.
    // Opening this card launches the complete interactive flipbook instead.
    if (flag('flipbook', false)) {
      const defaultPreview = 'https://opmedia-dev.github.io/flipbook/preview.html';
      let preview;
      try {
        preview = new URL(param('flipbookUrl', defaultPreview));
        if (preview.protocol !== 'https:') throw new Error('HTTPS required');
      } catch {
        preview = new URL(defaultPreview);
      }
      const fullPreview = new URL(preview.href);
      // A pasted old compact-reader URL must still open the *full* experience.
      fullPreview.searchParams.delete('tools');
      fullPreview.searchParams.delete('maxHeight');
      if (fullPreview.searchParams.get('title') === '0') fullPreview.searchParams.delete('title');
      if (param('flipbookLink')) fullPreview.searchParams.set('link', param('flipbookLink'));
      if (param('accent') && !fullPreview.searchParams.has('accent')) fullPreview.searchParams.set('accent', param('accent'));

      const side = h('aside', { class: 'wo-banner-side', 'aria-label': 'Latest parish magazine' });
      banner.classList.add('has-side');
      banner.append(side);

      const card = (issue) => {
        const label = param('flipbookTitle', 'Latest magazine');
        return h('a', {
          class: 'wo-card wo-magazine-card',
          href: fullPreview.href,
          target: '_blank',
          rel: 'noopener noreferrer',
          'aria-label': `Open ${issue.title} in the full interactive magazine reader`,
        },
          h('div', { class: 'wo-card-media wo-magazine-cover' },
            issue.cover
              ? h('img', { src: issue.cover, alt: `Cover of ${issue.title}`, loading: 'lazy' })
              : h('div', { class: 'wo-magazine-placeholder' }, icon('file'), 'Magazine')),
          h('div', { class: 'wo-card-body wo-magazine-body' },
            h('h3', { class: 'wo-card-title wo-magazine-title' }, issue.title),
            h('p', { class: 'wo-card-meta' }, icon('file'), h('span', {}, label !== '0' ? label : 'Magazine')),
            h('p', { class: 'wo-card-meta' }, icon('arrow'), h('span', {}, 'Read magazine'))));
      };

      side.replaceChildren(card({ title: 'Latest parish magazine', cover: null }));
      loadMagazineIssue(preview.href)
        .then((issue) => { side.replaceChildren(card(issue)); syncMagazineHeight(); })
        .catch((error) => {
          // A missing or inaccessible catalogue must not affect event cards.
          console.warn('Magazine cover unavailable; keeping the reader link:', error);
        });
    }

    // Event card heights are determined by the tallest title/metadata in the
    // three-card grid. Align the magazine precisely to that actual row height,
    // rather than assuming both card bodies happen to have the same text height.
    // The magazine stacks naturally below the event grid on narrower embeds.
    const syncMagazineHeight = () => {
      const card = banner.querySelector('.wo-magazine-card');
      const heights = [...cardsEl.querySelectorAll('.wo-card')].map((e) => e.getBoundingClientRect().height);
      if (!card) return;
      card.style.height = heights.length && banner.clientWidth > 1120
        ? `${Math.ceil(Math.max(...heights))}px`
        : '';
    };

    const allLink = param('moreLink', param('link'));
    if (/^https?:\/\//.test(allLink) && param('moreText') !== '0') {
      document.getElementById('foot').append(h('a', { class: 'wo-more-link', href: allLink, target: '_top' }, param('moreText', 'See all events'), icon('arrow')));
    }

    try {
      const { events } = await loadEvents();
      const now = new Date();
      const days = horizonDays(param('days'));
      let upcoming = nextPerSeries(events.filter((e) =>
        isUpcoming(e, now) && (param('show', 'featured') === 'all' || e.featured)));
      upcoming = upcoming.filter((e) => e.startDate - now < days * 86400000);
      upcoming = upcoming.slice(0, Math.max(1, Math.min(60, num('max', 9))));
      // The most recent sent weekly mailing is one carousel card alongside
      // events, not a blog post and not an event on the calendar. The magazine
      // remains fixed in column four and never rotates away.
      const mailingData = await loadMailings().catch((error) => {
        console.warn('Weekly mailings unavailable, continuing with events:', error);
        return { preview: false, mailings: [] };
      });
      const latest = flag('mailing', true) ? mailingData.mailings[0] : null;
      const items = [
        ...(latest ? [{ type: 'mailing', mailing: latest, preview: mailingData.preview }] : []),
        ...upcoming.map((event) => ({ type: 'event', event })),
      ];
      if (latest) {
        document.getElementById('foot').append(h('a', {
          class: 'wo-more-link', href: new URL('mailings.html', location.href).href,
          target: '_blank', rel: 'noopener noreferrer',
        }, 'Past weekly mailings', icon('arrow')));
      }

      let page = 0;
      const perPageMax = num('perPage', 3);
      const perPage = () => Math.max(1, Math.min(perPageMax, Math.floor(cardsEl.clientWidth / num('minCardWidth', 240)) || 1));
      let current = perPage();
      const render = () => {
        current = perPage();
        const pages = Math.ceil(items.length / current);
        page = Math.min(page, Math.max(0, pages - 1));
        cardsEl.style.setProperty('--wo-cols', String(current));
        cardsEl.replaceChildren(...items.slice(page * current, page * current + current)
          .map((item) => item.type === 'mailing'
            ? makeMailingCard(item.mailing, { preview: item.preview, h, icon })
            : renderCard(item.event, { showRecurrence: item.event.recurring })));
        pagerEl.replaceChildren(renderPager(page, pages, (p) => { page = p; render(); }));
        if (!items.length) cardsEl.replaceChildren(emptyState(param('emptyText', 'More events coming soon.')));
      };
      render();
      syncMagazineHeight();
      new ResizeObserver(() => {
        if (perPage() !== current) render();
        syncMagazineHeight();
      }).observe(cardsEl);
      const seconds = autoplaySeconds(param('autoplay'));
      if (seconds > 0) {
        let hovered = false;
        banner.addEventListener('mouseenter', () => { hovered = true; });
        banner.addEventListener('mouseleave', () => { hovered = false; });
        setInterval(() => {
          const pages = Math.ceil(items.length / current);
          const focusWithin = banner.contains(document.activeElement);
          const reducedMotion = window.matchMedia?.('(prefers-reduced-motion: reduce)').matches || false;
          if (mayAutoAdvance({
            pages, hovered, focusWithin, hidden: document.hidden,
            detailOpen: !document.getElementById('detail').hidden, reducedMotion,
          })) {
            page = (page + 1) % pages;
            render();
            syncMagazineHeight();
          }
        }, seconds * 1000);
      }
      routeDetails({ main: document.getElementById('main'), detail: document.getElementById('detail'), events, backLabel: param('backText', 'Back') });
    } catch (e) {
      console.error(e);
      showError(cardsEl, 'Sorry, events could not be loaded.');
    }
  </script>
</body>
</html>
