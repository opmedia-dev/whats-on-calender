<!doctype html>
<html lang="en" data-detail="inline">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>What's happening</title>
  <link rel="stylesheet" href="assets/wo.css?v=monthly-inline-viewer-20261104">
</head>
<body>
  <main class="wo-wrap">
    <div id="main">
      <h2 class="wo-heading" id="heading" hidden></h2>
      <div class="wo-banner" id="banner">
        <div class="wo-banner-main"><div id="cards" class="wo-cards is-band"><p class="wo-loading">Loading…</p></div><div class="wo-foot" id="foot"><div id="pager"></div></div></div>
      </div>
      <section id="monthlyViewer" class="wo-monthly-reader" aria-labelledby="monthlyViewerTitle" hidden>
        <header class="wo-monthly-reader-header">
          <button id="monthlyViewerClose" class="wo-monthly-back" type="button">← Back to What's On</button>
          <div>
            <p class="wo-monthly-reader-kicker">MONTHLY WHAT'S ON</p>
            <h2 id="monthlyViewerTitle" tabindex="-1">Monthly notice</h2>
          </div>
        </header>
        <div class="wo-monthly-reader-controls" aria-label="Poster viewing controls">
          <span>Read or enlarge the poster below</span>
          <div class="wo-monthly-zoom-controls">
            <button id="monthlyZoomOut" type="button" aria-label="Zoom out of poster">−</button>
            <output id="monthlyZoomLevel" aria-live="polite">100%</output>
            <button id="monthlyZoomIn" type="button" aria-label="Zoom in on poster">+</button>
          </div>
        </div>
        <div id="monthlyViewerMedia" class="wo-monthly-reader-media">
          <img id="monthlyViewerImage" alt="Monthly events notice">
        </div>
        <div class="wo-monthly-reader-pdf-actions">
          <button id="monthlyViewerFullPdf" type="button" hidden>Read the full PDF within this page</button>
        </div>
        <div id="monthlyViewerPdfPanel" class="wo-monthly-reader-pdf" hidden>
          <iframe id="monthlyViewerPdfFrame" title="Full monthly notice PDF" loading="lazy"></iframe>
        </div>
        <p class="wo-monthly-reader-help">Use the Back button to return to the upcoming events.</p>
      </section>
    </div>
    <div id="detail" hidden></div>
  </main>
  <script type="module">
    import { init, loadEvents, params, param, num, flag, h, icon, isUpcoming, nextPerSeries, renderCard, renderPager, routeDetails, showError, emptyState, postToParent } from './assets/wo.js?v=monthly-poster-20261104';
    import { loadMagazineIssue, magazineDestination } from './assets/magazine.js';
    import { loadMailings, makeMailingCard } from './assets/mailings.js?v=mailchimp-logo-20261102';
    import { horizonDays, autoplaySeconds, mayAutoAdvance, eventSlots, currentAndNextMonths, chronologicalBannerItems } from './assets/banner-config.js?v=two-month-posters-20261104';

    const initialisation = init(); // Start the host handshake while event data loads.
    // Mailing and calendar requests are independent; start them together.
    const mailingPreload = flag('mailing', true)
      ? loadMailings().catch((error) => {
          console.warn('Weekly mailings unavailable, continuing with events:', error);
          return { preview: false, mailings: [] };
        })
      : Promise.resolve({ preview: false, mailings: [] });
    const cardsEl = document.getElementById('cards');
    const pagerEl = document.getElementById('pager');
    const banner = document.getElementById('banner');

    const title = param('title', "What's happening");
    if (title !== '0') {
      const head = document.getElementById('heading');
      head.textContent = title;
      head.hidden = false;
    }
    if (param('style') === 'plain') cardsEl.classList.remove('is-band');
    if (params.has('ratio')) cardsEl.style.setProperty('--wo-ratio', param('ratio').replace(':', ' / '));

    // Show the latest issue as a fourth card, matched to the event-card
    // proportions. A full page-turning PDF reader cannot fit in a card-size
    // column: its minimum book height plus controls exceeded the event row.
    // Clicking takes visitors to the configured parish magazine archive.
    // Only fall back to the hosted full reader when no archive URL was set.
    if (flag('flipbook', false)) {
      const defaultPreview = 'https://opmedia-dev.github.io/flipbook/preview.html';
      let preview;
      try {
        preview = new URL(param('flipbookUrl', defaultPreview));
        if (preview.protocol !== 'https:') throw new Error('HTTPS required');
      } catch {
        preview = new URL(defaultPreview);
      }
      // Distinguish the preview used for cover metadata from the *website*
      // destination. Previously 'flipbookLink' only created a "View all issues"
      // link inside preview.html while the card href ignored it.
      const destination = magazineDestination(
        preview.href, param('flipbookLink'), param('accent')
      );

      const side = h('aside', { class: 'wo-banner-side', 'aria-label': 'Latest parish magazine' });
      banner.classList.add('has-side');
      banner.append(side);

      const card = (issue) => {
        const label = param('flipbookTitle', 'Latest magazine');
        return h('a', {
          class: 'wo-card wo-magazine-card',
          href: destination.href,
          target: '_blank',
          rel: 'noopener noreferrer',
          'aria-label': destination.usesArchive
            ? `Open the parish magazine archive for ${issue.title}`
            : `Open ${issue.title} in the full interactive magazine reader`,
        },
          h('div', { class: 'wo-card-media wo-magazine-cover' },
            issue.cover
              ? h('img', { src: issue.cover, alt: `Cover of ${issue.title}`, loading: 'lazy' })
              : h('div', { class: 'wo-magazine-placeholder' }, icon('file'), 'Magazine')),
          h('div', { class: 'wo-card-body wo-magazine-body' },
            h('h3', { class: 'wo-card-title wo-magazine-title' }, issue.title),
            h('p', { class: 'wo-card-meta' }, icon('file'), h('span', {}, label !== '0' ? label : 'Magazine')),
            h('p', { class: 'wo-card-meta' }, icon('arrow'),
              h('span', {}, destination.usesArchive ? 'View magazine archive' : 'Read magazine'))));
      };

      side.replaceChildren(card({ title: 'Latest parish magazine', cover: null }));
      loadMagazineIssue(preview.href)
        .then((issue) => { side.replaceChildren(card(issue)); syncFixedCardHeights(); })
        .catch((error) => {
          // A missing or inaccessible catalogue must not affect event cards.
          console.warn('Magazine cover unavailable; keeping the reader link:', error);
        });
    }

    // Publication cards remain fixed while events rotate. Match their height
    // to the tallest natural card in the row, and let the event grid stretch
    // when a publication has more text. Reset before measuring to prevent a
    // taller previous slide artificially increasing later slides.
    const syncFixedCardHeights = () => {
      const fixed = [...banner.querySelectorAll('.wo-banner-mailing .wo-card, .wo-banner-side .wo-card')];
      cardsEl.style.minHeight = '';
      fixed.forEach((card) => { card.style.height = ''; });
      if (banner.clientWidth <= 1120) return;
      const heights = [...cardsEl.querySelectorAll('.wo-card'), ...fixed]
        .map((card) => card.getBoundingClientRect().height);
      if (!heights.length) return;
      const height = `${Math.ceil(Math.max(...heights))}px`;
      cardsEl.style.minHeight = height;
      fixed.forEach((card) => { card.style.height = height; });
    };

    const allLink = param('moreLink', param('link'));
    if (/^https?:\/\//.test(allLink) && param('moreText') !== '0') {
      document.getElementById('foot').append(h('a', { class: 'wo-more-link', href: allLink, target: '_top' }, param('moreText', 'See all events'), icon('arrow')));
    }

    try {
      const [, { events, monthlyNotices = {} }] = await Promise.all([initialisation, loadEvents()]);
      const now = new Date();
      const [currentMonth, nextMonth] = currentAndNextMonths(now);
      const monthlyViewer = document.getElementById('monthlyViewer');
      const monthlyImage = document.getElementById('monthlyViewerImage');
      const monthlyMedia = document.getElementById('monthlyViewerMedia');
      const pdfPanel = document.getElementById('monthlyViewerPdfPanel');
      const pdfFrame = document.getElementById('monthlyViewerPdfFrame');
      const fullPdf = document.getElementById('monthlyViewerFullPdf');
      let readerTrigger = null;
      let activePdf = '';
      let zoom = 100;
      const setZoom = (value) => {
        zoom = Math.max(100, Math.min(250, value));
        monthlyImage.style.width = zoom + '%';
        document.getElementById('monthlyZoomLevel').textContent = zoom + '%';
        document.getElementById('monthlyZoomOut').disabled = zoom === 100;
        document.getElementById('monthlyZoomIn').disabled = zoom === 250;
      };
      const closeMonthlyViewer = () => {
        if (monthlyViewer.hidden) return;
        monthlyViewer.hidden = true;
        banner.hidden = false;
        monthlyImage.removeAttribute('src');
        pdfFrame.removeAttribute('src');
        pdfPanel.hidden = true;
        const previous = readerTrigger;
        readerTrigger = null;
        if (previous?.isConnected) previous.focus({ preventScroll: true });
        // The existing Duda embed listener restores the iframe's position.
        postToParent({ type: 'scrollToTop' });
      };
      const openMonthlyViewer = (notice, monthName, trigger) => {
        readerTrigger = trigger;
        monthlyViewer.hidden = false;
        banner.hidden = true;
        document.getElementById('monthlyViewerTitle').textContent =
          "What's On — " + monthName;
        monthlyImage.src = notice.image.src;
        monthlyImage.alt = 'Full monthly events poster for ' + monthName;
        setZoom(100);
        monthlyMedia.scrollLeft = 0;
        activePdf = notice.mimeType === 'application/pdf' &&
          new URL(notice.file, location.href).origin === location.origin ? notice.file : '';
        fullPdf.hidden = !activePdf;
        fullPdf.textContent = 'Read the full PDF within this page';
        pdfPanel.hidden = true;
        pdfFrame.removeAttribute('src');
        document.getElementById('monthlyViewerClose').focus({ preventScroll: true });
        postToParent({ type: 'scrollToTop' });
      };
      document.getElementById('monthlyViewerClose')
        .addEventListener('click', closeMonthlyViewer);
      document.getElementById('monthlyZoomIn')
        .addEventListener('click', () => setZoom(zoom + 50));
      document.getElementById('monthlyZoomOut')
        .addEventListener('click', () => setZoom(zoom - 50));
      fullPdf.addEventListener('click', () => {
        if (!activePdf) return;
        pdfPanel.hidden = !pdfPanel.hidden;
        if (pdfPanel.hidden) pdfFrame.removeAttribute('src');
        else pdfFrame.src = activePdf;
        fullPdf.textContent = pdfPanel.hidden
          ? 'Read the full PDF within this page' : 'Hide full PDF';
      });
      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape' && !monthlyViewer.hidden) {
          event.preventDefault();
          closeMonthlyViewer();
        }
      });
      const renderMonthlyCard = ({ notice, month }) => {
        const monthName = new Intl.DateTimeFormat('en-GB', {
          month: 'long', year: 'numeric', timeZone: 'UTC',
        }).format(new Date(month + '-01T12:00:00Z'));
        const isCurrent = month === currentMonth;
        const label = isCurrent ? "What's On this Month" : "What's On Next Month";
        return h('button', {
          type: 'button', class: 'wo-card wo-monthly-card',
          'aria-label': 'Read monthly events poster for ' + monthName,
          onclick: (event) => openMonthlyViewer(notice, monthName, event.currentTarget),
        },
          h('div', { class: 'wo-card-media wo-monthly-cover' },
            h('img', { src: notice.image.src, alt: 'Events poster — ' + monthName, loading: 'eager' })),
          h('div', { class: 'wo-card-body wo-monthly-body' },
            h('h3', { class: 'wo-card-title' }, label),
            h('p', { class: 'wo-card-meta' }, icon('calendar'), h('span', {}, monthName)),
            h('span', { class: 'wo-card-link' },
              notice.mimeType === 'application/pdf' ? 'Open monthly PDF' : 'View monthly poster', icon('arrow'))));
      };
      const days = horizonDays(param('days')); // Defaults to 400 days; old embeds with ?days=14 remain restricted until updated.
      // Event slots show editorial selections only, not every event with artwork.
      let upcoming = nextPerSeries(events.filter((e) => isUpcoming(e, now) && e.featured === true));
      upcoming = upcoming.filter((e) => e.startDate - now < days * 86400000);
      upcoming = upcoming.slice(0, Math.max(1, Math.min(60, num('max', 9))));
      // The most recent sent weekly mailing is now a FIXED third-column card:
      // the event carousel rotates only actual calendar events. The parish
      // magazine is the other fixed publication, normally in column four.
      // The separate mailing archive remains available at mailings.html; no
      // redundant archive button is added below the carousel.
      const mailingData = await mailingPreload;
      const latest = mailingData.mailings[0];
      if (latest) {
        const fixedMailing = h('aside', {
          class: 'wo-banner-mailing', 'aria-label': 'Latest parish weekly mailing',
        }, makeMailingCard(latest, { preview: mailingData.preview, h, icon }));
        // Insert before the fixed magazine, regardless of its enabled state.
        banner.insertBefore(fixedMailing, banner.querySelector('.wo-banner-side'));
        banner.classList.add('has-mailing');
      }

      // Rotate posters alongside featured events, immediately before each
      // month's first event (including when the month has no featured event).
      const items = chronologicalBannerItems(upcoming, monthlyNotices, [currentMonth, nextMonth]);
      let page = 0;
      const perPageMax = eventSlots({
        magazine: banner.classList.contains('has-side'),
        mailing: Boolean(latest),
        max: num('perPage', 3),
      });
      const perPage = () => Math.max(1, Math.min(perPageMax, Math.floor(cardsEl.clientWidth / num('minCardWidth', 240)) || 1));
      let current = perPage();
      const render = () => {
        current = perPage();
        const pages = Math.ceil(items.length / current);
        page = Math.min(page, Math.max(0, pages - 1));
        cardsEl.style.setProperty('--wo-cols', String(current));
        cardsEl.replaceChildren(...items.slice(page * current, page * current + current)
          .map((item) => item.type === 'monthly'
            ? renderMonthlyCard(item)
            : renderCard(item.event, { showRecurrence: item.event.recurring })));
        pagerEl.replaceChildren(renderPager(page, pages, (p) => {
          page = p;
          render();
          syncFixedCardHeights();
        }));
        if (!items.length) cardsEl.replaceChildren(emptyState(param('emptyText', 'More events coming soon.')));
      };
      render();
      syncFixedCardHeights();
      // Observing card *height* while assigning min-height to that same
      // element can create a ResizeObserver feedback loop. Only width changes
      // affect column count and responsive height matching.
      let measuredWidth = cardsEl.getBoundingClientRect().width;
      new ResizeObserver((entries) => {
        const width = entries[0]?.contentRect.width ?? cardsEl.getBoundingClientRect().width;
        if (Math.abs(width - measuredWidth) < 1) return;
        measuredWidth = width;
        if (perPage() !== current) render();
        syncFixedCardHeights();
      }).observe(cardsEl);
      const seconds = autoplaySeconds(param('autoplay'));
      if (seconds > 0) {
        let hovered = false;
        banner.addEventListener('mouseenter', () => { hovered = true; });
        banner.addEventListener('mouseleave', () => { hovered = false; });
        setInterval(() => {
          const pages = Math.ceil(items.length / current);
          const focusWithin = banner.contains(document.activeElement);
          const reducedMotion = window.matchMedia?.('(prefers-reduced-motion: reduce)').matches || false;
          if (mayAutoAdvance({
            pages, hovered, focusWithin, hidden: document.hidden,
            detailOpen: !document.getElementById('detail').hidden || !monthlyViewer.hidden, reducedMotion,
          })) {
            page = (page + 1) % pages;
            render();
            syncFixedCardHeights();
          }
        }, seconds * 1000);
      }
      routeDetails({ main: document.getElementById('main'), detail: document.getElementById('detail'), events, backLabel: param('backText', 'Back') });
    } catch (e) {
      console.error(e);
      showError(cardsEl, 'Sorry, events could not be loaded.');
    }
  </script>
</body>
</html>
