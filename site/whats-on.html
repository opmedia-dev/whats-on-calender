<!doctype html>
<html lang="en" data-detail="inline">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>What's On</title>
  <link rel="stylesheet" href="assets/wo.css?v=month-arrows-highlights-20261102">
</head>
<body>
  <main class="wo-wrap">
    <div id="main">
      <section class="wo-section" id="highlights-section" hidden>
        <div class="wo-section-head"><h2 class="wo-section-title" id="highlights-title">Highlights</h2></div>
        <div id="highlights" class="wo-cards"></div>
      </section>
      <section class="wo-section" id="regular-section" hidden>
        <div class="wo-section-head" id="regular-head"><h2 class="wo-section-title" id="regular-title"></h2></div>
        <div id="regular" class="wo-cards is-overlay"></div>
      </section>
      <section class="wo-section" id="upcoming-section">
        <div class="wo-section-head"><h2 class="wo-section-title" id="upcoming-title"></h2><span class="wo-count" id="count" aria-live="polite"></span></div>
        <div class="wo-toolbar">
          <label class="wo-search" id="search-box"><svg class="wo-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16zM21 21l-4.3-4.3"/></svg><input id="search" type="search" placeholder="Search events" aria-label="Search events" autocomplete="off"></label>
          <div class="wo-filters" id="filters" role="group" aria-label="Show"></div>
        </div>
        <div id="month-navigation" class="wo-month-navigation">
          <h3 id="selected-month" aria-live="polite"></h3>
          <div class="wo-cal-nav">
            <div class="wo-group"><button type="button" id="month-today">This month</button></div>
            <div class="wo-group">
              <button type="button" id="month-prev" aria-label="Previous month">‹</button>
              <button type="button" id="month-next" aria-label="Next month">›</button>
            </div>
          </div>
        </div>
        <div id="cards" class="wo-cards"><p class="wo-loading">Loading events…</p></div>
        <div class="wo-foot"><div id="pager"></div></div>
      </section>
    </div>
    <div id="detail" hidden></div>
  </main>
  <script type="module">
    import { init, loadEvents, params, param, num, flag, h, dayKey, isUpcoming, nextPerSeries, renderCard, renderPager, routeDetails, scrollHostToTop, showError, emptyState } from './assets/wo.js?v=monthly-highlights-20261102';
    import { shiftMonth, isValidMonth, clampMonth, eventsInMonth } from './assets/month-selection.js';

    await init();
    const cardsEl = document.getElementById('cards');
    const pagerEl = document.getElementById('pager');
    const regularEl = document.getElementById('regular');
    const filtersEl = document.getElementById('filters');
    const countEl = document.getElementById('count');
    const search = document.getElementById('search');
    const setTitle = (id, text) => { const el = document.getElementById(id); el.textContent = text === '0' ? '' : text; el.hidden = text === '0'; };
    if (!flag('search', true)) document.getElementById('search-box').hidden = true;
    if (param('searchText')) search.placeholder = param('searchText');
    if (params.has('ratio')) cardsEl.style.setProperty('--wo-ratio', param('ratio').replace(':', ' / '));
    if (param('style') === 'band') cardsEl.classList.add('is-band');
    const moreText = param('moreText', 'More info');
    const summaries = flag('summary', true);

    try {
      const { events, range } = await loadEvents();
      const now = new Date();
      const upcoming = events.filter((e) => isUpcoming(e, now));
      const series = nextPerSeries(upcoming);
      const featured = nextPerSeries(upcoming.filter((e) => e.featured === true));

      // Highlights is always a dedicated section, never a filter/tab.
      const highlightsEl = document.getElementById('highlights');
      const highlightsSection = document.getElementById('highlights-section');
      const highlighted = featured.slice(0, Math.max(1, Math.min(18, num('highlightsMax', 6))));
      highlightsSection.hidden = !highlighted.length;
      setTitle('highlights-title', param('highlightsTitle', 'Highlights'));
      if (highlighted.length) {
        highlightsEl.replaceChildren(...highlighted.map((e) => renderCard(e, { showRecurrence: e.recurring, more: moreText })));
      }

      // Keep the optional Regular events strip, but avoid repeating Highlights.
      const regular = flag('regular', true)
        ? series.filter((e) => e.recurring && !e.featured).slice(0, num('regularMax', 6)) : [];
      if (regular.length) {
        document.getElementById('regular-section').hidden = false;
        setTitle('regular-title', param('regularTitle', 'Regular events'));
        regularEl.replaceChildren(...regular.map((e) => renderCard(e, { showRecurrence: true, more: moreText })));
      }
      setTitle('upcoming-title', param('upcomingTitle', 'Events'));

      const ym = (date) => dayKey(date).slice(0, 7);
      const currentMonth = ym(now);
      const minMonth = range?.from ? ym(new Date(range.from)) : currentMonth;
      const maxMonth = range?.to ? ym(new Date(range.to)) : shiftMonth(currentMonth, 12);
      let selectedMonth = clampMonth(isValidMonth(param('month')) ? param('month') : currentMonth, minMonth, maxMonth);

      const week = upcoming.filter((e) => e.startDate - now < 7 * 86400000);
      const labels = { month: 'Month', week: 'This week', all: 'All events' };
      const filterKeys = Object.keys(labels);
      let filter = filterKeys.includes(param('filter')) ? param('filter') : 'month';
      filtersEl.hidden = !flag('filters', true);
      const navigation = document.getElementById('month-navigation');
      const previous = document.getElementById('month-prev');
      const next = document.getElementById('month-next');
      const todayButton = document.getElementById('month-today');
      previous.addEventListener('click', () => { if (selectedMonth > minMonth) { selectedMonth = shiftMonth(selectedMonth, -1); page = 0; render(); } });
      next.addEventListener('click', () => { if (selectedMonth < maxMonth) { selectedMonth = shiftMonth(selectedMonth, 1); page = 0; render(); } });
      todayButton.addEventListener('click', () => { selectedMonth = currentMonth; page = 0; render(); });

      const perPageMax = num('perPage', 9);
      let page = 0;
      let cols = 3;
      const columns = () => Math.max(1, Math.min(num('cols', 3), Math.floor(cardsEl.clientWidth / num('minCardWidth', 260)) || 1));
      const matches = (e, q) => [e.title, e.location, e.info?.summary || '', e.recurrence || ''].join(' ').toLowerCase().includes(q);
      const monthEvents = () => eventsInMonth(events, selectedMonth);
      const renderFilters = () => filtersEl.replaceChildren(...filterKeys.map((k) => h('button', {
        type: 'button', class: 'wo-chip', 'aria-pressed': String(k === filter),
        onclick: () => { filter = k; page = 0; renderFilters(); render(); },
      }, labels[k])));

      const render = (scroll) => {
        const q = search.value.trim().toLowerCase();
        const lists = { month: monthEvents(), week, all: series };
        const items = q ? lists[filter].filter((e) => matches(e, q)) : lists[filter];
        navigation.hidden = filter !== 'month';
        document.getElementById('selected-month').textContent = new Intl.DateTimeFormat('en-GB', { month: 'long', year: 'numeric' })
          .format(new Date(selectedMonth + '-15T12:00:00Z'));
        previous.disabled = selectedMonth <= minMonth;
        next.disabled = selectedMonth >= maxMonth;
        todayButton.disabled = selectedMonth === currentMonth;
        cols = columns();
        const perPage = Math.max(cols, Math.floor(perPageMax / cols) * cols || cols);
        const pages = Math.ceil(items.length / perPage);
        page = Math.min(page, Math.max(0, pages - 1));
        cardsEl.style.setProperty('--wo-cols', String(cols));
        highlightsEl.style.setProperty('--wo-cols', String(cols));
        regularEl.style.setProperty('--wo-cols', String(Math.min(cols, regular.length || 1)));
        // Repeat labels and recurrence patterns are visible in every view.
        cardsEl.replaceChildren(...items.slice(page * perPage, (page + 1) * perPage)
          .map((e) => renderCard(e, { showRecurrence: e.recurring, summary: summaries, more: moreText })));
        if (!items.length) cardsEl.replaceChildren(emptyState(q ? `No events match “${search.value.trim()}”.` : 'No events for this period.'));
        countEl.textContent = `${items.length} event${items.length === 1 ? '' : 's'}`;
        pagerEl.replaceChildren(renderPager(page, pages, (p) => { page = p; render(true); }));
        if (scroll) { document.getElementById('upcoming-section').scrollIntoView({ block: 'start' }); scrollHostToTop(); }
      };
      search.addEventListener('input', () => { page = 0; render(); });
      renderFilters();
      render();
      new ResizeObserver(() => { if (columns() !== cols) render(); }).observe(cardsEl);
      routeDetails({ main: document.getElementById('main'), detail: document.getElementById('detail'), events, backLabel: param('backText', "Back to What's On") });
    } catch (e) {
      console.error(e);
      showError(cardsEl, 'Sorry, events could not be loaded.');
    }
  </script>
</body>
</html>
