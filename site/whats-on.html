<!doctype html>
<html lang="en" data-detail="inline">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>What's On</title>
  <link rel="stylesheet" href="assets/wo.css">
</head>
<body>
  <main class="wo-wrap">
    <div id="main">
      <section class="wo-section" id="regular-section" hidden>
        <div class="wo-section-head" id="regular-head"><h2 class="wo-section-title" id="regular-title"></h2></div>
        <div id="regular" class="wo-cards is-overlay"></div>
      </section>
      <section class="wo-section" id="upcoming-section">
        <div class="wo-section-head"><h2 class="wo-section-title" id="upcoming-title"></h2><span class="wo-count" id="count" aria-live="polite"></span></div>
        <div class="wo-toolbar">
          <label class="wo-search" id="search-box"><svg class="wo-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16zM21 21l-4.3-4.3"/></svg><input id="search" type="search" placeholder="Search events" aria-label="Search events" autocomplete="off"></label>
          <div class="wo-filters" id="filters" role="group" aria-label="Show"></div>
        </div>
        <div id="cards" class="wo-cards"><p class="wo-loading">Loading events…</p></div>
        <div class="wo-foot"><div id="pager"></div></div>
      </section>
    </div>
    <div id="detail" hidden></div>
  </main>
  <script type="module">
    import { init, loadEvents, params, param, num, flag, h, isUpcoming, nextPerSeries, renderCard, renderPager, routeDetails, scrollHostToTop, showError, emptyState } from './assets/wo.js';

    await init();
    const cardsEl = document.getElementById('cards');
    const pagerEl = document.getElementById('pager');
    const regularEl = document.getElementById('regular');
    const filtersEl = document.getElementById('filters');
    const countEl = document.getElementById('count');
    const search = document.getElementById('search');
    const setTitle = (id, text) => { const el = document.getElementById(id); el.textContent = text === '0' ? '' : text; el.hidden = text === '0'; };
    if (!flag('search', true)) document.getElementById('search-box').hidden = true;
    if (param('searchText')) search.placeholder = param('searchText');
    if (params.has('ratio')) cardsEl.style.setProperty('--wo-ratio', param('ratio').replace(':', ' / '));
    if (param('style') === 'band') cardsEl.classList.add('is-band');
    const moreText = param('moreText', 'More info');
    const summaries = flag('summary', true);

    try {
      const { events } = await loadEvents();
      const now = new Date();
      const upcoming = events.filter((e) => isUpcoming(e, now));
      const series = nextPerSeries(upcoming);

      // Regular events: repeating events with a picture, one tile per series.
      const regular = flag('regular', true) ? series.filter((e) => e.recurring && e.featured).slice(0, num('regularMax', 6)) : [];
      if (regular.length) {
        document.getElementById('regular-section').hidden = false;
        setTitle('regular-title', param('regularTitle', 'Regular events'));
        regularEl.replaceChildren(...regular.map((e) => renderCard(e, { showRecurrence: true, more: moreText })));
      }
      setTitle('upcoming-title', param('upcomingTitle', 'Coming up'));

      const within = (days) => upcoming.filter((e) => e.startDate - now < days * 86400000);
      const lists = {
        featured: series.filter((e) => e.featured && !regular.includes(e)),
        week: within(7),
        month: within(31),
        all: series,
      };
      const labels = { featured: 'Highlights', week: 'This week', month: 'This month', all: 'All events' };
      const filterKeys = Object.keys(labels).filter((k) => k !== 'featured' || lists.featured.length);
      let filter = param('show') === 'all' ? 'all' : filterKeys.includes(param('filter')) ? param('filter') : filterKeys[0];
      const showFilters = flag('filters', true);
      filtersEl.hidden = !showFilters;

      const perPageMax = num('perPage', 9);
      let page = 0;
      let cols = 3;
      const columns = () => Math.max(1, Math.min(num('cols', 3), Math.floor(cardsEl.clientWidth / num('minCardWidth', 260)) || 1));
      const matches = (e, q) => [e.title, e.location, e.info.summary, e.recurrence].join(' ').toLowerCase().includes(q);

      const renderFilters = () => filtersEl.replaceChildren(...filterKeys.map((k) => h('button', {
        type: 'button', class: 'wo-chip', 'aria-pressed': String(k === filter),
        onclick: () => { filter = k; page = 0; renderFilters(); render(); },
      }, labels[k])));

      const render = (scroll) => {
        const q = search.value.trim().toLowerCase();
        const dated = filter === 'week' || filter === 'month';
        // Searching covers every upcoming event, not just the ones with pictures.
        const items = q ? (dated ? lists[filter] : series).filter((e) => matches(e, q)) : lists[filter];
        cols = columns();
        const perPage = Math.max(cols, Math.floor(perPageMax / cols) * cols || cols);
        const pages = Math.ceil(items.length / perPage);
        page = Math.min(page, Math.max(0, pages - 1));
        cardsEl.style.setProperty('--wo-cols', String(cols));
        regularEl.style.setProperty('--wo-cols', String(Math.min(cols, regular.length || 1)));
        cardsEl.replaceChildren(...items.slice(page * perPage, (page + 1) * perPage)
          .map((e) => renderCard(e, { showRecurrence: !dated && e.recurring, summary: summaries, more: moreText })));
        if (!items.length) cardsEl.replaceChildren(emptyState(q ? `No events match “${search.value.trim()}”.` : param('emptyText', 'More events coming soon.')));
        countEl.textContent = `${items.length} event${items.length === 1 ? '' : 's'}`;
        pagerEl.replaceChildren(renderPager(page, pages, (p) => { page = p; render(true); }));
        if (scroll) { document.getElementById('upcoming-section').scrollIntoView({ block: 'start' }); scrollHostToTop(); }
      };
      search.addEventListener('input', () => { page = 0; render(); });
      renderFilters();
      render();
      new ResizeObserver(() => { if (columns() !== cols) render(); }).observe(cardsEl);
      routeDetails({ main: document.getElementById('main'), detail: document.getElementById('detail'), events, backLabel: param('backText', "Back to What's On") });
    } catch (e) {
      console.error(e);
      showError(cardsEl, 'Sorry, events could not be loaded.');
    }
  </script>
</body>
</html>
